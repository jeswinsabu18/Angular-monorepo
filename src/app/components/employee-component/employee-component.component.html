
<app-page-shell class="employee-table-shell">
  <app-toolbar
    toolbar
    [searchTerm]="searchTerm()"
    [canAdd]="canAdd"
    (searchChanged)="onSearch($event)"
    (addEmployee)="openAddModal()"
  ></app-toolbar>

  <app-data-table
    [rows]="employees()"
    [columns]="employeeColumns"
    [rowKey]="'employeeId'"
    [sortField]="sortField()"
    [sortDirection]="sortDirection()"
    [paginationResetTrigger]="searchTerm()"
    [canEdit]="canEdit"
    [canDelete]="canDelete"
    ariaLabel="Employee records"
    (sortChanged)="sortBy($event)"
    (editRow)="onEditRow($event)"
    (deleteRow)="onDeleteRow($event)"
  ></app-data-table>

  @if (isModalOpen) {
    <app-employee-form-modal
      [visible]="isModalOpen"
      [isEditing]="isEditing"
      [form]="form"
      (close)="closeModal()"
      (submitForm)="saveEmployee($event)"
    ></app-employee-form-modal>
  }

  <app-delete-confirmation-modal
    [visible]="isDeleteModalOpen"
    (close)="closeDeleteModal()"
    (confirm)="confirmDelete()"
  ></app-delete-confirmation-modal>
</app-page-shell>
