
<app-page-shell class="employee-table-shell">
  <app-toolbar
    toolbar
    [searchTerm]="searchTerm()"
    [canAdd]="canAdd"
    (searchChanged)="onSearch($event)"
    (addEmployee)="openAddModal()"
  ></app-toolbar>

  @if (isLoading()) {
    <p class="loading-message" role="status">
      Loading employees...
    </p>
  }

  @if (loadError()) {
    <p class="error-message" role="alert">
      {{ loadError() }}
    </p>

    <button type="button" (click)="loadEmployeesPage()">
      Retry
    </button>
  }

  <app-data-table
    [rows]="pageRows()"
    [columns]="employeeColumns"
    [rowKey]="'employeeId'"
    [sortField]="sortField()"
    [sortDirection]="sortDirection()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalItems]="totalItems()"
    [canEdit]="canEdit"
    [canDelete]="canDelete"
    ariaLabel="Employee records"
    (pageChanged)="onPageChanged($event)"
    (pageSizeChanged)="onPageSizeChanged($event)"
    (sortChanged)="sortBy($event)"
    (editRow)="onEditRow($event)"
    (deleteRow)="onDeleteRow($event)"
  ></app-data-table>

  @if (isModalOpen) {
    <app-employee-form-modal
      [visible]="isModalOpen"
      [isEditing]="isEditing"
      [form]="form"
      (close)="closeModal()"
      (submitForm)="saveEmployee($event)"
    ></app-employee-form-modal>
  }

  <app-delete-confirmation-modal
    [visible]="isDeleteModalOpen"
    (close)="closeDeleteModal()"
    (confirm)="confirmDelete()"
  ></app-delete-confirmation-modal>
</app-page-shell>
